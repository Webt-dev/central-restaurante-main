<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica o último tema salvo antes da primeira pintura (evita piscar claro/escuro).
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('cr.theme') || 'system'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        // Modo leve: decide antes da primeira pintura para não animar nada em aparelho fraco.
        var p = 'auto';
        try { p = localStorage.getItem('cr.perf') || 'auto'; } catch (e) {}
        var lite = p === 'lite';
        if (p === 'auto') {
          var nav = navigator;
          lite = (nav.deviceMemory && nav.deviceMemory <= 4) ||
                 (nav.hardwareConcurrency && nav.hardwareConcurrency <= 2) ||
                 (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        }
        if (lite) document.documentElement.setAttribute('data-perf', 'lite');
      })();
    </script>
    <title>Central Restaurante - Sistema Multi-telas</title>
    <!-- Fonte Inter é empacotada no próprio sistema (src/fonts.css): funciona sem internet. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
